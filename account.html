<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generator — ComboMODE</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar">
<a href="index.html" class="logo">Combo<span>MODE</span></a>

<div class="nav-links">
<a href="index.html">Home</a>
<a class="active" href="generator.html">Generator</a>
<a href="wardrobe.html">Wardrobe</a>
<a href="inspo.html">AI Stylist</a>
<a href="plans.html">Plans</a>
<a href="shop.html">Shop</a>
<a href="account.html">Account</a>
</div>
</nav>

<main>

<section class="page">

<p class="eyebrow">COMBOMODE GENERATOR</p>

<h1>
BUILD YOUR
<br>
<span>FIT.</span>
</h1>

<p class="hero-text">
Tell ComboMODE what you're going for.
We'll build a fit around your vibe.
</p>

<div class="panel">

<form id="generatorForm" class="form-grid">

<div class="field">
<label>STYLE</label>
<select id="style">
<option value="dark">Dark Streetwear</option>
<option value="streetwear">Streetwear</option>
<option value="archive">Archive</option>
<option value="grunge">Grunge</option>
<option value="clean">Minimal</option>
<option value="clean">Old Money</option>
<option value="streetwear">Y2K</option>
<option value="technical">Techwear</option>
<option value="streetwear">Casual</option>
</select>
</div>

<div class="field">
<label>MAIN COLOR</label>
<select id="color">
<option>Black</option>
<option>White</option>
<option>Grey</option>
<option>Navy</option>
<option>Brown</option>
<option>Beige</option>
<option>Earth Tones</option>
<option>Dark Colors</option>
<option>Mixed Colors</option>
</select>
</div>

<div class="field">
<label>OCCASION</label>
<select id="occasion">
<option>Everyday</option>
<option>School</option>
<option>Church</option>
<option>Party</option>
<option>Date</option>
<option>Night Out</option>
<option>Formal</option>
<option>Summer Day</option>
<option>Winter</option>
</select>
</div>

<div class="field">
<label>SILHOUETTE</label>
<select id="fit">
<option>Oversized</option>
<option>Baggy</option>
<option>Relaxed</option>
<option>Straight</option>
<option>Slim</option>
<option>Fitted</option>
</select>
</div>

<div class="field">
<label>FOOTWEAR</label>
<select id="footwear">
<option>Sneakers</option>
<option>Chunky Sneakers</option>
<option>Boots</option>
<option>Loafers</option>
<option>Dress Shoes</option>
<option>Anything</option>
</select>
</div>

<div class="field">
<label>BRAND VIBE</label>
<select id="brand">
<option>No Specific Brand</option>
<option>Stüssy</option>
<option>Carhartt</option>
<option>Stone Island</option>
<option>New Balance</option>
<option>Nike</option>
<option>adidas</option>
<option>Supreme</option>
<option>Fear of God ESSENTIALS</option>
<option>ASICS</option>
<option>Salomon</option>
<option>Vans</option>
<option>Dickies</option>
<option>Levi's</option>
</select>
</div>

<div class="field full">
<label>WHAT DO YOU ALREADY OWN?</label>
<input id="wardrobeItems"
placeholder="black oversized tee, baggy jeans, black Vans...">
</div>

<div class="field full">
<button class="btn primary" type="submit">
GENERATE MY FIT →
</button>
</div>

</form>

<div id="generatorResult" class="result">
<p>Your generated outfit will appear here.</p>
</div>

</div>

</section>

</main>

<footer class="footer" data-footer></footer>

<script src="fashion-brain.js"></script>
<script src="app.js"></script>

<script>

const form = document.getElementById("generatorForm");
const result = document.getElementById("generatorResult");

form.addEventListener("submit", e => {

  e.preventDefault();

  const style = document.getElementById("style").value;
  const color = document.getElementById("color").value;
  const occasion = document.getElementById("occasion").value;
  const fitStyle = document.getElementById("fit").value;
  const footwear = document.getElementById("footwear").value;
  const brand = document.getElementById("brand").value;
  const wardrobe = document.getElementById("wardrobeItems").value;

  const fit =
    window.NXTLOOK_STYLE_BRAIN.generateFit(style);

  result.innerHTML = `

    <h3>YOUR COMBOMODE</h3>

    <div class="result-item">
      <strong>TOP</strong>
      <p>${escapeHTML(fit.top)}</p>
    </div>

    <div class="result-item">
      <strong>BOTTOM</strong>
      <p>${escapeHTML(fit.bottom)}</p>
    </div>

    <div class="result-item">
      <strong>SHOES</strong>
      <p>${escapeHTML(fit.shoes)}</p>
    </div>

    <div class="result-item">
      <strong>LAYER</strong>
      <p>${escapeHTML(fit.layer)}</p>
    </div>

    <div class="result-item">
      <strong>ACCESSORIES</strong>
      <p>${escapeHTML(fit.accessory)}</p>
    </div>

    <div class="result-item">
      <strong>COLOR</strong>
      <p>${escapeHTML(color)}</p>
    </div>

    <div class="result-item">
      <strong>OCCASION</strong>
      <p>${escapeHTML(occasion)}</p>
    </div>

    <div class="result-item">
      <strong>SILHOUETTE</strong>
      <p>${escapeHTML(fitStyle)}</p>
    </div>

    <div class="result-item">
      <strong>FOOTWEAR VIBE</strong>
      <p>${escapeHTML(footwear)}</p>
    </div>

    <div class="result-item">
      <strong>BRAND VIBE</strong>
      <p>${escapeHTML(brand)}</p>
    </div>

    ${
      wardrobe.trim()
      ? `
      <div class="result-item">
        <strong>YOUR WARDROBE</strong>
        <p>${escapeHTML(wardrobe)}</p>
      </div>
      `
      : ""
    }

    <div class="result-item">
      <strong>FIT SCORE</strong>
      <p style="font-size:32px;color:#a8ff00;font-weight:900">
        9/10
      </p>
    </div>

    <button
      id="saveFit"
      class="btn primary"
      type="button">
      SAVE LOOK ★
    </button>

    <button
      id="again"
      class="btn secondary"
      type="button">
      GENERATE AGAIN →
    </button>
  `;

  document.getElementById("saveFit").onclick = () => {

    if (!getCurrentUser()) {
      window.location.href = "account.html";
      return;
    }

    saveLook({
      style,
      color,
      occasion,
      silhouette: fitStyle,
      footwear,
      brand,
      wardrobe,
      top: fit.top,
      bottom: fit.bottom,
      shoes: fit.shoes,
      layer: fit.layer,
      accessory: fit.accessory
    });

    alert("LOOK SAVED ✓");
  };

  document.getElementById("again").onclick = () => {
    form.requestSubmit();
  };

  result.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

});

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
