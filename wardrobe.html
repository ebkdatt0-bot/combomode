<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wardrobe — ComboMODE</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar">
<a href="index.html" class="logo">Combo<span>MODE</span></a>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="generator.html">Generator</a>
<a class="active" href="wardrobe.html">Wardrobe</a>
<a href="inspo.html">AI Stylist</a>
<a href="plans.html">Plans</a>
<a href="shop.html">Shop</a>
<a href="account.html">Account</a>
</div>
</nav>

<main>

<section class="page">

<p class="eyebrow">MY WARDROBE</p>

<h1>
YOUR
<br>
<span>CLOSET.</span>
</h1>

<p class="hero-text">
Add what you already own and build fits around it.
</p>

<div id="loginNotice" class="panel hidden">
<p>
You need an account to save your wardrobe.
</p>
<br>
<a href="account.html" class="btn primary">
LOGIN / CREATE ACCOUNT →
</a>
</div>

<div id="wardrobeApp" class="panel">

<form id="itemForm">

<div class="form-grid">

<div class="field">
<label>ITEM</label>
<input id="itemName" placeholder="Black oversized tee" required>
</div>

<div class="field">
<label>CATEGORY</label>
<select id="itemCategory">
<option>Top</option>
<option>Bottom</option>
<option>Shoes</option>
<option>Layer</option>
<option>Accessory</option>
</select>
</div>

<div class="field">
<label>COLOR</label>
<input id="itemColor" placeholder="Black">
</div>

<div class="field">
<label>STYLE</label>
<input id="itemStyle" placeholder="Streetwear">
</div>

</div>

<br>

<button class="btn primary">
ADD TO WARDROBE +
</button>

</form>

<div id="wardrobeList" style="margin-top:30px"></div>

</div>

</section>

</main>

<footer class="footer" data-footer></footer>

<script src="app.js"></script>

<script>

const app = document.getElementById("wardrobeApp");
const notice = document.getElementById("loginNotice");
const form = document.getElementById("itemForm");
const list = document.getElementById("wardrobeList");

if (!getCurrentUser()) {
  app.classList.add("hidden");
  notice.classList.remove("hidden");
}

function renderWardrobe() {

  const items = getWardrobe();

  if (!items.length) {
    list.innerHTML =
      `<p class="muted">Your wardrobe is empty.</p>`;
    return;
  }

  list.innerHTML = items.map((item,index) => `

    <div class="result-item">

      <strong>${escapeHTML(item.category)}</strong>

      <h3 style="margin-top:8px">
        ${escapeHTML(item.name)}
      </h3>

      <p>
        ${escapeHTML(item.color || "No color")}
        ·
        ${escapeHTML(item.style || "No style")}
      </p>

      <button
        class="btn secondary"
        style="margin-top:12px"
        onclick="removeItem(${index})">
        REMOVE
      </button>

    </div>

  `).join("");
}

form.addEventListener("submit",e => {

  e.preventDefault();

  const items = getWardrobe();

  items.push({
    name: document.getElementById("itemName").value.trim(),
    category: document.getElementById("itemCategory").value,
    color: document.getElementById("itemColor").value.trim(),
    style: document.getElementById("itemStyle").value.trim()
  });

  saveWardrobe(items);

  form.reset();
  renderWardrobe();
});

function removeItem(index) {

  const items = getWardrobe();

  items.splice(index,1);

  saveWardrobe(items);

  renderWardrobe();
}

renderWardrobe();

</script>

</body>
</html>
